name: Build Quartz Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone Quartz 5.2.2
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v5.2.2 https://github.com/jackyzha0/quartz.git "$RUNNER_TEMP/quartz"

      - name: Install Quartz dependencies
        working-directory: ${{ runner.temp }}/quartz
        run: npm ci

      - name: Patch explorer for read:true markers
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os

          roots = [
              Path(os.environ["RUNNER_TEMP"]) / "quartz" / "node_modules" / "@quartz-community" / "explorer",
          ]
          needle = 'd.textContent=u.displayName||u.slugSegment,u.data.slug===t&&E.classList.add("active","is-active")'
          patch = (
              'd.textContent=u.displayName||u.slugSegment,'
              'u.data.slug===t&&E.classList.add("active","is-active"),'
              '(u.data.read===!0||u.data.read===true||u.data.read==="true")&&E.classList.add("epa-done")'
          )
          # In the minified inline string, booleans are `!0` for true; keep both forms for safety.
          patched = 0
          for root in roots:
              for path in root.rglob("*.js"):
                  text = path.read_text(encoding="utf-8")
                  if needle not in text:
                      continue
                  path.write_text(text.replace(needle, patch), encoding="utf-8")
                  patched += 1
                  print(f"patched {path}")
          if patched == 0:
              raise SystemExit("ERROR: explorer read-marker patch target not found")
          print(f"ok: patched {patched} file(s)")
          PY

      - name: Prepare content and config
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/quartz"
          rm -rf "$Q/content"
          mkdir -p "$Q/content"

          # 复制笔记（排除仓库元数据与构建配置）
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.obsidian/' \
            --exclude '.claudian/' \
            --exclude '.copilot/' \
            --exclude 'node_modules/' \
            --exclude '_site/' \
            --exclude '.DS_Store' \
            ./ "$Q/content/"

          cp .github/quartz/quartz.config.yaml "$Q/quartz.config.yaml"
          cp .github/quartz/custom.scss "$Q/quartz/styles/custom.scss"

      - name: Build Quartz
        working-directory: ${{ runner.temp }}/quartz
        run: npx quartz build --config quartz.config.yaml -o "$GITHUB_WORKSPACE/_site" -v

      - name: Slim contentIndex.json and inject read flags
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re, sys
          from pathlib import Path

          candidates = [
              Path("_site/static/contentIndex.json"),
              Path("static/contentIndex.json"),
          ]
          found = next((p for p in candidates if p.is_file()), None)
          if found is None:
              for p in Path(".").rglob("contentIndex.json"):
                  found = p
                  break
          if found is None:
              print("ERROR: contentIndex.json not found", file=sys.stderr)
              sys.exit(1)

          read_re = re.compile(r"(?m)^read:\s*(?:true|True|yes|YES|1)\s*$")

          def frontmatter_read(path: Path) -> bool:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError:
                  return False
              if not text.startswith("---"):
                  return False
              end = text.find("\n---", 3)
              if end < 0:
                  return False
              return bool(read_re.search(text[3:end]))

          before = found.stat().st_size
          data = json.loads(found.read_text(encoding="utf-8"))
          n = 0
          marked = 0
          for entry in data.values():
              if not isinstance(entry, dict):
                  continue
              n += 1
              entry.pop("content", None)
              entry.pop("richContent", None)

              fp = entry.get("filePath") or ""
              candidates_fp = []
              if isinstance(fp, str) and fp:
                  candidates_fp.extend([Path(fp), Path("content") / fp])
              slug = entry.get("slug")
              if isinstance(slug, str) and slug:
                  candidates_fp.extend([Path(f"{slug}.md"), Path("content") / f"{slug}.md"])

              is_read = False
              for cand in candidates_fp:
                  if cand.is_file() and frontmatter_read(cand):
                      is_read = True
                      break
              if is_read:
                  entry["read"] = True
                  marked += 1
              else:
                  entry.pop("read", None)

          found.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          after = found.stat().st_size
          print(
              f"slimmed {found}: {n} entries, {marked} read=true, "
              f"{before/1024/1024:.2f}MB -> {after/1024/1024:.2f}MB"
          )
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

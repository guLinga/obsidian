name: Build Quartz Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone Quartz 5.2.2
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v5.2.2 https://github.com/jackyzha0/quartz.git "$RUNNER_TEMP/quartz"

      - name: Install Quartz dependencies
        working-directory: ${{ runner.temp }}/quartz
        run: npm ci

      - name: Prepare content and config
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/quartz"
          rm -rf "$Q/content"
          mkdir -p "$Q/content"

          # 复制笔记（排除仓库元数据与构建配置）
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.obsidian/' \
            --exclude '.claudian/' \
            --exclude '.copilot/' \
            --exclude 'node_modules/' \
            --exclude '_site/' \
            --exclude '.DS_Store' \
            ./ "$Q/content/"

          cp .github/quartz/quartz.config.yaml "$Q/quartz.config.yaml"
          cp .github/quartz/custom.scss "$Q/quartz/styles/custom.scss"

      - name: Build Quartz
        working-directory: ${{ runner.temp }}/quartz
        run: npx quartz build --config quartz.config.yaml -o "$GITHUB_WORKSPACE/_site" -v

      - name: Slim contentIndex.json
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, sys
          from pathlib import Path

          candidates = [
              Path("_site/static/contentIndex.json"),
              Path("static/contentIndex.json"),
          ]
          found = next((p for p in candidates if p.is_file()), None)
          if found is None:
              for p in Path(".").rglob("contentIndex.json"):
                  found = p
                  break
          if found is None:
              print("ERROR: contentIndex.json not found", file=sys.stderr)
              sys.exit(1)

          before = found.stat().st_size
          data = json.loads(found.read_text(encoding="utf-8"))
          n = 0
          for entry in data.values():
              if not isinstance(entry, dict):
                  continue
              n += 1
              entry.pop("content", None)
              entry.pop("richContent", None)
          found.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          after = found.stat().st_size
          print(f"slimmed {found}: {n} entries, {before/1024/1024:.2f}MB -> {after/1024/1024:.2f}MB")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

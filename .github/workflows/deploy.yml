name: Build Quartz Site

on:
  push:
    branches: ["main"]   # 如果你的默认分支是 master，改成 master
  workflow_dispatch:      # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write         # 部署 Pages 所需的令牌权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Quartz
        uses: konstfish/quartz-build-action@v7
        with:
          # ⬇️ 关键：改成你存放 Obsidian 笔记的文件夹路径
          source: ./
          page_title: "我的知识库"   # 浏览器标签页显示的标题

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
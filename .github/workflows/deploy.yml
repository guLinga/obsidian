name: Build Quartz Site

on:
  push:
    branches: ["main"]   # 如果你的默认分支是 master，改成 master
  workflow_dispatch:      # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write         # 部署 Pages 所需的令牌权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Quartz
        uses: konstfish/quartz-build-action@v7
        with:
          # ⬇️ 关键：改成你存放 Obsidian 笔记的文件夹路径
          source: ./
          destination: _site
          page_title: "我的知识库"   # 浏览器标签页显示的标题
          # 自定义配置：大纲 maxDepth: 6 等写在这里
          quartz_config: .github/quartz/quartz.config.ts
          # 自定义布局：去掉 Graph 等重型组件
          quartz_layout: .github/quartz/quartz.layout.ts
          # 自定义样式：右侧大纲可完整滚动
          quartz_custom_css: .github/quartz/custom.scss

      # 去掉 contentIndex 全文：首屏只留标题索引，正文在各详情页 HTML
      - name: Slim contentIndex.json
        run: |
          set -e
          find . -name 'contentIndex.json' 2>/dev/null | head -n 20 || true
          node .github/quartz/slim-content-index.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4